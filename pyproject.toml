[project]
name = "ggufram"
version = "0.1.0"
description = "What will this GGUF cost in unified memory? Header-derived KV-cache and resident-RAM arithmetic — pure stdlib."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JesusMonjeGonzalez" }]
keywords = ["gguf", "kv-cache", "apple-silicon", "unified-memory", "llama-cpp", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/JesusMonjeGonzalez/ggufram"
Issues = "https://github.com/JesusMonjeGonzalez/ggufram/issues"
Repository = "https://github.com/JesusMonjeGonzalez/ggufram.git"

[project.scripts]
ggufram = "ggufram.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ggufram"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
